# ═══════════════════════════════════════════════════════════════════════════
# Microgrid IEMS, the whole stack in one file
# ═══════════════════════════════════════════════════════════════════════════
# Start it with the scripts, which check your .env first.
#   macOS or Linux   ./scripts/start.sh
#   Windows          .\scripts\start.ps1
#
# Or directly with Docker Compose.
#   docker compose up -d --build
#
# Which optional parts run is chosen by COMPOSE_PROFILES in .env.
#   (always)  postgres, master, operator1, kafka, anylog-consumer, ollama,
#             iems-inference, iems-backend, iems-dashboard
#   demo      demo-replay, plays a recorded scenario so no hardware is needed
#   live      egauge-producer and solar-producer, read a real eGauge meter
#             and a real Solar Assistant
#   gui       iems-app, the AnyLog Remote GUI with the IEMS page
#   tools     kafka-ui, a web view of the Kafka topic
#
# Step by step instructions are in docs/guide/.
# ═══════════════════════════════════════════════════════════════════════════

name: iems

services:

  # ── Postgres, the time series store behind AnyLog ───────────────────────
  postgres:
    image: postgres:14.0-alpine
    container_name: postgres1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passwd}
      POSTGRES_DB: ${POSTGRES_DB:-customers}
      POSTGRES_INITDB_ARGS: "--auth=md5"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./streaming/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-customers}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── AnyLog metadata node ─────────────────────────────────────────────────
  master:
    image: ${ANYLOG_IMAGE:-anylogco/anylog-network:2.1.2608}
    container_name: master
    restart: always
    stdin_open: true
    tty: true
    env_file:
      - ./streaming/anylog/docker-makefiles/master-configs/base_configs.env
      - ./streaming/anylog/docker-makefiles/master-configs/advance_configs.env
      - ./streaming/anylog/docker-makefiles/.env
    environment:
      LICENSE_KEY: ${ANYLOG_LICENSE:?Set ANYLOG_LICENSE in .env, see docs/guide/03_configure.md}
      ANYLOG_LICENSE: ${ANYLOG_LICENSE}
      AKAVE_ACCESS_KEY_RC2: ${AKAVE_ACCESS_KEY_RC2}
      AKAVE_SECRET_KEY_RC2: ${AKAVE_SECRET_KEY_RC2}
      AKAVE_ENDPOINT_RC2: ${AKAVE_ENDPOINT_RC2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "32048:32048"
      - "32049:32049"
    volumes:
      - master-anylog:/app/AnyLog-Network/anylog
      - master-blockchain:/app/AnyLog-Network/blockchain
      - master-data:/app/AnyLog-Network/data
    depends_on:
      postgres:
        condition: service_healthy

  # ── AnyLog operator node ─────────────────────────────────────────────────
  operator1:
    image: ${ANYLOG_IMAGE:-anylogco/anylog-network:2.1.2608}
    container_name: operator1
    user: root
    restart: always
    stdin_open: true
    tty: true
    env_file:
      - ./streaming/anylog/docker-makefiles/operator1-configs/base_configs.env
      - ./streaming/anylog/docker-makefiles/operator1-configs/advance_configs.env
      - ./streaming/anylog/docker-makefiles/.env
    environment:
      LICENSE_KEY: ${ANYLOG_LICENSE:?Set ANYLOG_LICENSE in .env, see docs/guide/03_configure.md}
      ANYLOG_LICENSE: ${ANYLOG_LICENSE}
      AKAVE_ACCESS_KEY_RC2: ${AKAVE_ACCESS_KEY_RC2}
      AKAVE_SECRET_KEY_RC2: ${AKAVE_SECRET_KEY_RC2}
      AKAVE_ENDPOINT_RC2: ${AKAVE_ENDPOINT_RC2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "32148:32148"
      - "32149:32149"
      - "1883:1883"
    volumes:
      - operator1-anylog:/app/AnyLog-Network/anylog
      - operator1-blockchain:/app/AnyLog-Network/blockchain
      - operator1-data:/app/AnyLog-Network/data
      - operator1-external-lib:/app/AnyLog-Network/external_lib
      - operator1-local-scripts:/app/deployment-scripts
      # Permanent overrides: bypass startup script rebuild
      - ./streaming/anylog/docker-makefiles/operator1-configs/local_script.al:/app/deployment-scripts/node-deployment/local_script.al:ro
      - ./streaming/anylog/docker-makefiles/operator1-configs/patches/validate_node_policy.al:/app/deployment-scripts/node-deployment/policies/validate_node_policy.al:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      master:
        condition: service_started
      postgres:
        condition: service_healthy

  # ── Kafka (KRaft mode) ───────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://host.docker.internal:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Kafka web inspector (profile tools) ─────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: microgrid
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ── Kafka to AnyLog bridge, fills energy_readings ───────────────────────
  anylog-consumer:
    build:
      context: ./streaming/kafka-egauge-pipeline
      dockerfile: Dockerfile.consumer
    container_name: anylog-consumer
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_BROKER: "kafka:9092"
      KAFKA_TOPIC: "egauge-energy"
      KAFKA_GROUP: "anylog-bridge"
      ANYLOG_HOST: "host.docker.internal"
      ANYLOG_PORT: "32149"
      ANYLOG_DBMS: "customers"
      ANYLOG_TABLE: "energy_readings"
    depends_on:
      kafka:
        condition: service_healthy
      operator1:
        condition: service_started

  # ── Demo replay, a recorded scenario instead of real hardware (profile demo)
  demo-replay:
    build:
      context: ./streaming/demo-replay
    container_name: demo-replay
    profiles: ["demo"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DEMO_SCENARIO: ${DEMO_SCENARIO:-baseline_normal}
      DEMO_SPEED: ${DEMO_SPEED:-1}
      KAFKA_BROKER: "kafka:9092"
      KAFKA_TOPIC: "egauge-energy"
      ANYLOG_BROKER: "host.docker.internal"
      ANYLOG_BROKER_PORT: "1883"
      ANYLOG_TOPIC: "solar"
    volumes:
      - ./tests/scenarios/output:/scenarios:ro
    depends_on:
      kafka:
        condition: service_healthy
      operator1:
        condition: service_started

  # ── eGauge meter to Kafka (profile live) ────────────────────────────────
  egauge-producer:
    build:
      context: ./streaming/kafka-egauge-pipeline
      dockerfile: Dockerfile.producer
    container_name: egauge-producer
    profiles: ["live"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EGAUGE_URI: ${EGAUGE_URI:-}
      EGAUGE_USER: ${EGAUGE_USER:-owner}
      EGAUGE_PASS: ${EGAUGE_PASS:-}
      KAFKA_BROKER: "kafka:9092"
      KAFKA_TOPIC: "egauge-energy"
      POLL_INTERVAL: "1"
    depends_on:
      kafka:
        condition: service_healthy

  # ── Solar Assistant to AnyLog (profile live) ────────────────────────────
  solar-producer:
    build:
      context: ./streaming/solar-pipeline
      dockerfile: Dockerfile
    container_name: solar-producer
    profiles: ["live"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SA_BROKER: ${SA_BROKER:-}
      SA_PORT: ${SA_PORT:-1883}
      SA_USER: ${SA_USER:-}
      SA_PASS: ${SA_PASS:-}
      SA_PREFIX: ${SA_PREFIX:-solar_assistant}
      ANYLOG_HOST: "host.docker.internal"
      ANYLOG_PORT: "32149"
      ANYLOG_DBMS: "customers"
      ANYLOG_TABLE: "solar_data"
      INTERVAL: "5"
      INGEST_MODE: "broker"
      ANYLOG_BROKER: "host.docker.internal"
      ANYLOG_BROKER_PORT: "1883"
      ANYLOG_TOPIC: "solar"
    depends_on:
      operator1:
        condition: service_started

  # ── Ollama, the local language model behind Ask ─────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama

  # ── NILM inference loop, writes nilm_disaggregated ──────────────────────
  iems-inference:
    build:
      context: .
      dockerfile: ./services/iems/inference/Dockerfile
    image: iems-inference:local
    container_name: iems-inference
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ANYLOG_HOST: "host.docker.internal"
      ANYLOG_REST_PORT: "32149"
      HOUSE_LAT: ${HOUSE_LAT:-37.23}
      HOUSE_LON: ${HOUSE_LON:--121.96}
      HOUSE_TZ: ${HOUSE_TZ:-America/Los_Angeles}
      PGHOST: "postgres"
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-customers}
      PGUSER: "demo"
      PGPASSWORD: ${POSTGRES_PASSWORD:-passwd}
    command: ["--tick", "${INFERENCE_TICK_SECONDS:-30}"]
    depends_on:
      - operator1

  # ── IEMS engine API and Ask, port 8009 ──────────────────────────────────
  iems-backend:
    build:
      context: .
      dockerfile: ./services/iems/backend/Dockerfile
      additional_contexts:
        iems-base: "service:iems-inference"
    image: iems-backend:local
    container_name: iems-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8009}:8000"
    environment:
      ANYLOG_HOST: "host.docker.internal"
      ANYLOG_REST_PORT: "32149"
      HOUSE_LAT: ${HOUSE_LAT:-37.23}
      HOUSE_LON: ${HOUSE_LON:--121.96}
      HOUSE_TZ: ${HOUSE_TZ:-America/Los_Angeles}
      OLLAMA_URL: "http://ollama:11434"
      IEMS_ASK_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b-instruct}
      IEMS_DASH_URL: "http://iems-dashboard:47821"
    depends_on:
      - iems-inference
      - ollama

  # ── Live dashboard, port 47821 ──────────────────────────────────────────
  iems-dashboard:
    build:
      context: .
      dockerfile: ./services/iems/web/Dockerfile
    image: iems-dashboard:local
    container_name: iems-dashboard
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DASHBOARD_PORT:-47821}:47821"
    environment:
      ANYLOG_HOST: "host.docker.internal"
      ANYLOG_PORT: "32149"
      IEMS_HOST: "iems-backend"
      IEMS_PORT: "8000"
      DISPLAY_TZ: ${HOUSE_TZ:-America/Los_Angeles}
      HA_URL: ${HA_URL:-}
      HA_TOKEN_FILE: "/app/config/ha_token.txt"
    volumes:
      # Home Assistant token for the thermostat controls. Put a long lived
      # token in config/ha_token.txt. Without it the thermostat card stays empty.
      - ./config:/app/config:ro
    depends_on:
      - operator1

  # ── AnyLog Remote GUI with the IEMS page (profile gui) ─────────────────
  iems-app:
    build:
      context: ./services/remote-gui-overlay-212
    image: iems-remote-gui:local
    container_name: iems-app
    profiles: ["gui"]
    restart: unless-stopped
    ports:
      - "${GUI_API_PORT:-8000}:8000"
      - "${GUI_PORT:-3001}:31800"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REMOTE_GUI_BE: "8000"
      REMOTE_GUI_FE: "31800"
      VITE_API_URL: "http://localhost:${GUI_API_PORT:-8000}"
      REACT_APP_API_URL: "http://localhost:${GUI_API_PORT:-8000}"
      ANYLOG_REST_URL: "http://host.docker.internal:32149"
      ANYLOG_HOST: "host.docker.internal"
      ANYLOG_REST_PORT: "32149"
      ANYLOG_USER_AGENT: "AnyLog/1.23"
      ANYLOG_MCP_SSE_URL: "http://host.docker.internal:32149/mcp/sse"
      OLLAMA_URL: "http://ollama:11434"
      LLM_ENDPOINT: "http://ollama:11434"
      LLM_API_TYPE: "ollama"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b-instruct}
      IEMS_BACKEND_URL: "http://iems-backend:8000"
      IEMS_DASH_URL: "http://iems-dashboard:47821"
      PYTHONPATH: "/app:/app/services"
      HOUSE_LAT: ${HOUSE_LAT:-37.23}
      HOUSE_LON: ${HOUSE_LON:--121.96}
      HOUSE_TZ: ${HOUSE_TZ:-America/Los_Angeles}
      PGHOST: "postgres"
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-customers}
      PGUSER: "demo"
      PGPASSWORD: ${POSTGRES_PASSWORD:-passwd}
    volumes:
      - ./services/iems:/app/services/iems:ro
      - ./services/remote-gui-overlay-212/backend/iems/iems_router.py:/app/CLI/local-cli-backend/plugins/iems/iems_router.py:ro
    depends_on:
      - ollama
      - operator1
      - iems-backend

volumes:
  pgdata:
  kafka_data:
  ollama-data:
  master-anylog:
  master-blockchain:
  master-data:
  operator1-anylog:
  operator1-blockchain:
  operator1-data:
  operator1-external-lib:
  operator1-local-scripts:
